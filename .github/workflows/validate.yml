# Validation for the scheduled machinery. VALIDATION ONLY.
#
# This repository had no CI of any kind until 2026-09-09: `gh workflow list`
# returned nothing and no run had ever been recorded, while the repository held
# the scripts that grade every other repository on this account. Nothing had ever
# checked that ci-sweep-audit.sh — which fails the whole nightly sweep when it
# finds a weakening — so much as parses.
#
# THIS LANE DEPLOYS NOTHING AND USES NO SECRETS, deliberately and permanently.
# It lints shell, and it exercises the auditor and the probe through their own
# fixture modes, which need no network and no credentials.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # 20 Nov 2026: the ship-ready-baseline fixtures (a real browser, 16 sites) took the lane past 10 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is present
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1 || ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck zsh
          fi
          shellcheck --version
          bash --version | head -1

      - name: CI here must stay validation-only
        run: ./tests/validation-only.sh

      - name: Rule 0 — the lint must hard-fail when it examines nothing
        run: ./tests/test-rule-zero.sh

      - name: Lint every shell script (shellcheck + bash -n)
        run: ./tests/lint-shell.sh
      - name: launchd jobs install at Central times
        run: ./tests/test-launchd-central.sh

      - name: tz-watch keeps launchd on Central times when the Mac changes zone
        run: ./tests/test-tz-watch.sh

      # 27 Nov 2026, her "Try one site only": Search for Agents on one zone, and a money guard that
      # switches it off at 80% of the free AI Search allowance or after two days unable to read it.
      - name: agent-search changes one zone only and its money guard never says "under" when it could not read
        run: ./tests/test-agent-search.sh

      # Two workflows on one push to main (west-peek-os, 21 Sep 2026): land must watch the
      # gate run, never the journeys. Evals the pick_run block out of land against a fixture.
      - name: land must watch the gate run on a two-workflow main
        run: ./tests/test-land-pick-run.sh

      # A fresh merge watched a July run 12 s after merging (sprylabs-hpc-site #119, 7 Oct 2026):
      # land must wait for the run of its own merge commit before falling back to main's newest.
      - name: land must watch its own merge commit's run
        run: ./tests/test-land-merge-run.sh
      # 22 Nov 2026: land ships on the PR's green run only when the merge is byte-for-byte the tested tree.
      - name: land skips main's re-run only for the exact same code
        run: ./tests/test-land-same-tree.sh
      # 22 Nov 2026, west-peek-os #584: "main is green", then DEPLOY_RUN_NOT_FOUND, while CI was still queued.
      - name: land waits for main's CI before looking for the run CI triggers
        run: ./tests/test-land-gate-wait.sh
      # 22 Nov 2026: two overlapping local deploys filled the disk and both STOPPED over no error.
      - name: land's local release step names its error, runs one at a time, never on a full disk
        run: ./tests/test-land-local-ship.sh
      - name: pass-line posts only a sign-off land will read, through land's own parser
        run: ./tests/test-pass-line.sh
      - name: the Open Loops mirror hook rebuilds only after Open Loops changes and is never silent on an outage
        run: ./tests/test-open-loops-mirror-hook.sh

      # seq-bin's last land step fast-forwards the launchd copy (the main checkout, ~/bin), never
      # the worktree land runs from (20 Nov 2026: a false STOPPED after a good merge from a worktree).
      - name: land must fast-forward the launchd copy, wherever it runs from
        run: ./tests/test-land-launchd-copy.sh

      # The web property change lane (23 Sep 2026) lands partner changes with `land <pr>`; a site
      # repo with no route makes land stop after the work is built. Evals land's routes block.
      - name: land must know how every West Peek site repo reaches production
        run: ./tests/test-land-routes.sh

      # 25 Sep 2026, local-guides-generator #48: land said "nothing to run" while a Cloudflare Pages
      # production build had failed on the merge commit. Evals land's pages_watch block.
      - name: land must refuse a merge whose Cloudflare build failed
        run: ./tests/test-land-pages-watch.sh

      # 21 Oct 2026, p-n-p #124: GitHub dropped the merge's push event (no activity entry, no run, no
      # Pages build) and land watched the previous commit's run. Evals dropped_push + pages_kick.
      - name: land must re-raise a merge whose push event GitHub dropped
        run: ./tests/test-land-dropped-push.sh

      # 26 Sep 2026: land aborted a sync in her dirty checkout AFTER merging (lgcv #159), merged on an
      # empty head after a 401 (how-we-know #130), and refused a green PR on a TLS timeout (horse #35).
      # Drives the whole of land against a fake gh and a real git origin.
      - name: land must leave her checkout alone and never read could-not-check as an answer
        run: ./tests/test-land-flow.sh
      # 20 Nov 2026 (rows 6c, 6e, 20): land refuses a PR that changes what people see without a fresh
      # reviewer's Ship-ready PASS (Launch-ready for something new; a red ship-ready-baseline check),
      # and one that patches a function fixed in the last 30 days without "Patch or rebuild:".
      - name: land's gates refuse what they should (ship-ready, launch-ready, baseline, patch history)
        run: ./tests/test-land-gates.sh
      # 24 Nov 2026 (her words: "u said nothing yesterday"; Noelle, boss-os #557/#561, landed green and acted on 0 of
      # 11 decisions): land refuses a PR with no honest Outcome (none on a job file, no check, no floor, a write) or no
      # "## Not built"; the real #557 and #561 bodies are refused.
      - name: land refuses a PR that hides its outcome or what it cut (Outcome, Not built)
        run: ./tests/test-land-outcome.sh
      # 23 Nov 2026: a touched form needs a marked TEST submission on preview before land.
      - name: land's forms gate refuses an undeclared or unproved form
        run: ./tests/test-land-forms.sh
      # 27 Nov 2026 ("give a root fix to this ---is there a template followed?"; "everything doesnt fucking neeed a
      # reviewr"): `land --check` lists EVERY missing description line in one run, each with the line to add from the
      # ONE template (pr-body-template.md; red when land can ask for a line it does not carry); only her list waits on
      # a reviewer; a missing Review class line is read from the diff's paths, never guessed; an outage is exit 75;
      # --check makes no write call.
      - name: land --check lists every missing line at once, from the one template; only her list waits on a reviewer
        run: ./tests/test-land-check.sh
      # post-land-check RUNS each due outcome check itself through outcome-read (rebuilt 27 Nov 2026): no shell, none of
      # her logins, only fixed read tools; a model with NO tools judges the output and code posts its verdict. It
      # refuses a PASS below the floor, and an outage, no verdict or ai-run down stays DUE, NOT CHECKED, exit non-zero.
      - name: post-land-check never calls an unchecked outcome working
        run: ./tests/test-post-land-check.sh
      - name: outcome-read runs a check with no shell and no logins, and refuses everything but its read tools
        run: ./tests/test-outcome-read.sh
      # Tests found with no CI step on 24 Nov 2026 (they guarded nothing): now each has one.
      - name: land names the repo from its GitHub remote
        run: ./tests/test-land-name.sh
      - name: land's queue lands one PR at a time
        run: ./tests/test-land-queue.sh
      - name: build-phases sends a reviewer's fail back and is never READY while incomplete
        run: ./tests/test-build-phases.sh
      - name: the GitHub rate probe reads high, low and blind correctly
        run: ./tests/test-probe-rate-floor.sh
      # 22 Nov 2026: agents polling GitHub one by one spent the account's 5,000 REST calls an hour twice in a
      # morning. ~/bin/gh shares one cache and one allowance; writes are never held and drop the cache.
      - name: gh shares one GitHub allowance (cache, floor wait, writes never held, watchers back off)
        run: ./tests/test-gh-share.sh
      # Build first, test in batches (26 Sep 2026): staging on every land, `land --promote` ships
      # the newest green. 2 Oct 2026: a small change ships on the fast check; a large one only
      # through the suite; a known-red or unread suite blocks a small change. Evals land's plan
      # and verdict blocks and carries five negative proofs.
      - name: land must ship a small change on the fast check, a large one only through the suite, and never past a known-red suite
        run: ./tests/test-land-plan.sh
      # On demand only, after a large change (2 Oct 2026): the e2e workflows are dispatch-only, so
      # land runs the suite itself when the PR is large. Evals land's large block: every threshold
      # at its edge, every path trigger, unreadable = large, with a negative proof — and the range
      # block: every commit production has not seen is judged by the same rule.
      - name: land must measure "large change", never guess it
        run: ./tests/test-land-large.sh
      # 30 Oct 2026, p-n-p #162: Pages deployed code needing D1 migration 0026 and nothing applied
      # it. Evals land's routes + d1 blocks: migrate BEFORE the merge, confirm none pending after.
      - name: land must migrate a self-deploying repo's D1 before the merge
        run: ./tests/test-land-d1.sh

      # 1 Nov 2026: the nightly housekeeping job turns unsaved work, backup stops and the monthly rules
      # clean-up into Boss OS Open Loops rows, against a stub intake; a failed post must be a named stop.
      - name: housekeeping.sh opens and closes the right Open Loops rows
        run: ./tests/test-housekeeping.sh

      - name: the dangerous-command guard refuses each irreversible command and lets a harmless one through
        run: ./tests/test-command-guard.sh
      - name: a PR that patches a fix of the last 30 days is refused at gh pr create until it says why patch, not rebuild
        run: ./tests/test-pr-patch-check.sh
      - name: post-land-check turns each DUE line into a verdict, and an engineering FAIL into a fix sheet bannered nightly until it lands
        run: ./tests/test-post-land-check.sh
      # 27 Nov 2026 (her row #17): the nightly lessons pass only DRAFTS check lines; a model down is never "no failures".
      - name: lessons-pass sorts the day's failures with a no-tools model, counts repeats in code and never touches a rule
        run: shellcheck lessons-pass && ./tests/test-lessons-pass.sh
      - name: the agent launch gate refuses general agents and full re-reviews of a failed PR, and never caps agents
        run: ./tests/test-brief-gate.sh
      # 1 Nov 2026 (owner: "the listings should show more of OUR REAL WORK"): the photo step of the
      # Marketplace listings job, against a stand-in for wrangler. A store it cannot read is a named stop.
      - name: pnp-real-work.mjs lists real job photos newest first and never passes quietly on an unread store
        run: ./tests/test-pnp-real-work.sh
      - name: disk-sweep.sh removes only leaked clones, old fixtures and merged worktrees, and alerts once when low
        run: ./tests/test-disk-sweep.sh
      # 9 Nov 2026: the compaction hook overwrote a hand-written Today status in ~/HANDOFF.md.
      - name: handoff-on-compact.sh keeps a same-day hand-written status and replaces only its own note
        run: ./tests/test-handoff-keeps-curated.sh
      # 27 Nov 2026 (her words: "its not overwrting too much and i still have a complete picture at the end of the
      # day"): each compaction replaced the session's note with a summary of the last stretch only, and a dropped
      # or rolled-over note was gone. Notes now build up, every note that leaves is archived by day, the
      # post-land-check lines live in their own list, and code checks the model's PR numbers and paths.
      - name: handoff-on-compact.sh builds a session's note up, archives every note that leaves, and never lets an outage or an invented PR number into HANDOFF
        run: ./tests/test-handoff-day-picture.sh
      # 22 Nov 2026 (her words: "Hand waiting to a script, not an agent"): land-after lands a PASSed PR
      # detached and writes the result to the task sheet. Refuses no-PASS / twice / bad slugs; never PASS
      # on an unread answer or a land that merged nothing; cleanup only done/ and logs/ past 14 days.
      - name: land-after lands detached, refuses what it should, never reads could-not-check as PASS
        run: ./land-after --self-test
      # 23 Nov 2026 (her question, boss-os #552 red 3 h: "how do we catch and stop this issue?"): pr-watch lands a
      # quiet green PR through land-after or names it in HANDOFF; an unreadable list is couldn't check, never
      # "none stuck"; a held PR is never started twice; one banner per PR per day; only read verbs reach gh;
      # 07:00-09:59 CT it reads nothing.
      - name: pr-watch picks up every PR quiet 30+ min, never none-stuck on an outage, read-only on GitHub
        run: ./tests/test-pr-watch.sh

      - name: a named job is tailed, her own replies included
        run: ./tests/test-scooter-watch-named.sh
      - name: a card a developer has taken over never launches a tail
        run: ./tests/test-scooter-watch-takeover.sh
      - name: a card that recovered and waits on the partner raises no friction tail
        run: ./tests/test-scooter-watch-recovered.sh
      - name: a tail that cannot check for mail tells her, and its D1 calls carry the vault token
        run: ./tests/test-scooter-watch-fail.sh
      - name: A tail watchdog only stops its own agent
        run: ./tests/test-scooter-watch-watchdog.sh
      - name: Partner tail runs with background tasks off
        run: ./tests/test-scooter-watch-foreground.sh

  # 22 Nov 2026 (her ask: land faster, same quality): the lane is three parallel jobs, so the merge gate
  # finishes inside her 5-minute rule. Same steps, none removed (each runs in exactly one job).
  validate-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is present
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1 || ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck zsh
          fi
          shellcheck --version
          bash --version | head -1

      - name: ci-sweep-audit.sh must catch a weakening
        run: ./tests/test-audit-guard.sh

      - name: ci-sweep-probe.sh must map lane states to exit codes
        run: ./tests/test-probe-convergence.sh

      # 26 Oct 2026: crons outside a busy repo's newest 80 runs read as SILENT|NEVER_RAN. A lane
      # missing from the repo-wide list must be asked for its own newest run before it is silent.
      - name: ci-sweep-probe.sh must not call a lane outside the run-list window NEVER_RAN
        run: ./tests/test-probe-window.sh

      # 23 Nov 2026 (d10-scan-protect): the Divine 10 repos' code-scanning, secret-scanning and
      # Dependabot alerts are sweep lanes; an unread list (403/404/rate limit/5xx/no CodeQL
      # analysis) is RED or PENDING with a named stop, never clean. Fake gh only.
      - name: ci-sweep-alert-lanes.sh turns every alert type into fix work and never calls an unread list clean
        run: ./tests/test-alert-lanes.sh

      # Owner ruling 3 Nov 2026: Codex does the hands-on work, Claude only the brains; a Codex usage
      # limit hands the run to Claude (6 Nov), and a Claude usage limit runs once on the free API
      # credit, then is the named stop (27 Nov). Stub binaries and a stub vault only: no network, no key.
      # 22 Nov 2026: one Play products tool and one RevenueCat tool for every app (they were copies per repo).
      - name: the store tools write only what is missing and fail loudly on every outage
        run: ./tests/test-store-tools.sh

      - name: ai-run routes worker to Codex, brain to Claude; a Claude limit runs once on the free API credit, then stops by name
        run: ./tests/test-ai-run.sh

      # Her design of 2026-09-23 (then once a day at 06:00; Mon+Fri 08:00 since 2 Oct 2026): park per repo, rounds while
      # progress, the sweep merges only what it read green, opus pinned, one summary.
      # Drives ci-sweep.sh end to end through fake claude/gh/land/probe/audit.
      # 26 Sep 2026 (then daily 07:00/08:00): the retry gate found the primary run still in flight and lost the day's retry.
      - name: the 09:00 retry gate waits for an in-flight run and decides from its row
        run: ./tests/test-retry-gate.sh

      - name: an interrupted sweep resumes on wake, and only that
        run: ./tests/test-resume-on-wake.sh
      - name: ci-sweep.sh per-run design (tests/test-sweep-daily.sh) — park per repo, progress rounds, verified merges
        run: ./tests/test-sweep-daily.sh

      # The detectors must not be able to go back to matching strings. This runs
      # the audit fixtures and the trigger model against every workflow in the
      # repo, and hard-fails when it examines zero of either. Sections needing
      # the fleet checkout or the gh CLI skip themselves by name on a runner --
      # a named stop, not a silent pass -- and CI_SWEEP_SELFTEST_OFFLINE makes
      # that explicit rather than incidental.
      - name: the ci-sweep detectors must still detect
        env:
          CI_SWEEP_SELFTEST_OFFLINE: "1"
          CI_SWEEP_SELFTEST_SKIP_DAILY: "1"
        run: ./ci-sweep-selftest.sh

  validate-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is present
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1 || ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck zsh
          fi
          shellcheck --version
          bash --version | head -1

      # Row 18 (20 Nov 2026): the shared ship-ready-baseline tool catches every automatic fail on a
      # fixture site, passes a clean one, and fails on zero pages rendered.
      - name: ship-ready-baseline catches each automatic fail and passes a clean page
        run: |
          set -euo pipefail
          npm ci --prefix ship-ready-baseline --no-audit --no-fund
          npx --prefix ship-ready-baseline playwright install --with-deps chromium
          ./tests/test-ship-ready-baseline.sh

  # The encrypted snapshot needs hdiutil, so its fixture run is on a macOS runner (no secrets, no network).
  mac-snapshot:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone
        run: command -v rclone >/dev/null || brew install rclone
      - name: mac-snapshot builds, verifies, restores and never logs a secret
        run: ./tests/test-mac-snapshot.sh
      - name: the monthly restore drill proves each backup reads, and names the one that does not
        run: ./tests/test-restore-drill.sh
      - name: the nightly drive-backup stays small and leaves nothing private on Drive
        run: zsh ./tests/test-drive-backup-guards.sh
      - name: the Mac's day guard holds every class at the boundary, waits instead of running, never runs twice, stops heavy work at 06:55
        run: ./tests/test-mac-window.sh
      - name: a reload never unpauses, kills or loses a job, and a failed one keeps the old schedule
        run: ./tests/test-launchd-reload.sh
