name: probe-baseline-race (temp)
on: { push: { branches: [probe/baseline-race] } }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: |
          npm ci --prefix ship-ready-baseline --no-audit --no-fund
          npx --prefix ship-ready-baseline playwright install --with-deps chromium
          N=20 ./tests/probe-live-origin.sh
