# Validation for the scheduled machinery. VALIDATION ONLY.
#
# This repository had no CI of any kind until 2026-09-09: `gh workflow list`
# returned nothing and no run had ever been recorded, while the repository held
# the scripts that grade every other repository on this account. Nothing had ever
# checked that ci-sweep-audit.sh — which fails the whole nightly sweep when it
# finds a weakening — so much as parses.
#
# THIS LANE DEPLOYS NOTHING AND USES NO SECRETS, deliberately and permanently.
# It lints shell, and it exercises the auditor and the probe through their own
# fixture modes, which need no network and no credentials.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is present
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          bash --version | head -1

      - name: CI here must stay validation-only
        run: ./tests/validation-only.sh

      - name: Rule 0 — the lint must hard-fail when it examines nothing
        run: ./tests/test-rule-zero.sh

      - name: Lint every shell script (shellcheck + bash -n)
        run: ./tests/lint-shell.sh

      # Two workflows on one push to main (west-peek-os, 21 Sep 2026): land must watch the
      # gate run, never the journeys. Evals the pick_run block out of land against a fixture.
      - name: land must watch the gate run on a two-workflow main
        run: ./tests/test-land-pick-run.sh

      # The web property change lane (23 Sep 2026) lands partner changes with `land <pr>`; a site
      # repo with no route makes land stop after the work is built. Evals land's routes block.
      - name: land must know how every West Peek site repo reaches production
        run: ./tests/test-land-routes.sh

      # 25 Sep 2026, local-guides-generator #48: land said "nothing to run" while a Cloudflare Pages
      # production build had failed on the merge commit. Evals land's pages_watch block.
      - name: land must refuse a merge whose Cloudflare build failed
        run: ./tests/test-land-pages-watch.sh

      # 26 Sep 2026: land aborted a sync in her dirty checkout AFTER merging (lgcv #159), merged on an
      # empty head after a 401 (how-we-know #130), and refused a green PR on a TLS timeout (horse #35).
      # Drives the whole of land against a fake gh and a real git origin.
      - name: land must leave her checkout alone and never read could-not-check as an answer
        run: ./tests/test-land-flow.sh
      # Build first, test in batches (26 Sep 2026): staging on every land, production only on a
      # green full e2e for the exact sha, `land --promote` ships the newest green. Evals land's
      # plan block (two pure functions) and carries a negative proof.
      - name: land must hold production for a green full e2e and promote the newest green
        run: ./tests/test-land-plan.sh
      # On demand only, after a large change (2 Oct 2026): the e2e workflows are dispatch-only, so
      # land runs the suite itself when the PR is large. Evals land's large block: every threshold
      # at its edge, every path trigger, unreadable = large, with a negative proof.
      - name: land must measure "large change", never guess it
        run: ./tests/test-land-large.sh

      - name: ci-sweep-audit.sh must catch a weakening
        run: ./tests/test-audit-guard.sh

      - name: ci-sweep-probe.sh must map lane states to exit codes
        run: ./tests/test-probe-convergence.sh

      - name: ci-sweep-stream.py must leave a line-by-line round log with the sentinel intact
        run: ./tests/test-stream-filter.sh

      # Her design of 2026-09-23 (then once a day at 06:00; Mon+Fri 08:00 since 2 Oct 2026): park per repo, rounds while
      # progress, the sweep merges only what it read green, opus pinned, one summary.
      # Drives ci-sweep.sh end to end through fake claude/gh/land/probe/audit.
      # 26 Sep 2026 (then daily 07:00/08:00): the retry gate found the primary run still in flight and lost the day's retry.
      - name: the 09:00 retry gate waits for an in-flight run and decides from its row
        run: ./tests/test-retry-gate.sh

      - name: ci-sweep.sh per-run design (tests/test-sweep-daily.sh) — park per repo, progress rounds, verified merges
        run: ./tests/test-sweep-daily.sh

      # The detectors must not be able to go back to matching strings. This runs
      # the audit fixtures and the trigger model against every workflow in the
      # repo, and hard-fails when it examines zero of either. Sections needing
      # the fleet checkout or the gh CLI skip themselves by name on a runner --
      # a named stop, not a silent pass -- and CI_SWEEP_SELFTEST_OFFLINE makes
      # that explicit rather than incidental.
      - name: the ci-sweep detectors must still detect
        env:
          CI_SWEEP_SELFTEST_OFFLINE: "1"
          CI_SWEEP_SELFTEST_SKIP_DAILY: "1"
        run: ./ci-sweep-selftest.sh
